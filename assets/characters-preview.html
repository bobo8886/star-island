<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小满与阿屿 · 原创角色动作检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101e30;color:#eee4cf;font-family:system-ui;padding:32px}h1{font-size:26px;margin:0 0 8px;letter-spacing:3px}h2{font-size:18px;font-weight:500}p{font-size:13px;color:#aebed0;line-height:1.8}.characters{display:grid;grid-template-columns:1fr 1fr;gap:24px}.character{background:#17283b;border:1px solid #cfb77a30;border-radius:16px;padding:20px}.atlas{image-rendering:pixelated;width:100%;border:1px solid #65718455;background:repeating-conic-gradient(#233348 0 25%,#1d2d40 0 50%) 0/24px 24px}.design{max-width:1200px;display:block;margin-top:24px;width:100%;border-radius:16px}.live{display:flex;align-items:center;gap:12px;margin-bottom:16px}.live canvas{width:120px;height:150px;image-rendering:pixelated;border-radius:12px}button{border:1px solid #dbc18b66;background:#273b51;color:#fff1d7;padding:9px 15px;margin:4px;border-radius:7px;cursor:pointer}button.active{background:#bfa16f;color:#15273a}@media(max-width:760px){.characters{grid-template-columns:1fr}body{padding:16px}}
</style>
<h1>小满与阿屿 · 把每一步走成回忆</h1><p>原创角色 · 原画同源贴图 · 160 × 192 帧缓存 · 双向步态与八种姿态</p>
<div id="poses" aria-label="动作"></div><div id="directions" aria-label="朝向"></div><section class="characters"><article class="character"><h2>拾光旅人 · 小满</h2><div class="live"><canvas id="live-girl" width="160" height="200"></canvas><p>栗色小辫 / 蜜桃蝴蝶结<br>鼠尾草斗篷 / 星扣与提灯</p></div><canvas class="atlas" id="girl"></canvas></article><article class="character"><h2>同行旅人 · 阿屿</h2><div class="live"><canvas id="live-boy" width="160" height="200"></canvas><p>暖棕短发 / 珊瑚围巾<br>靛蓝外套 / 挎包与相机</p></div><canvas class="atlas" id="boy"></canvas></article></section>
<p>上四行：前 / 右 / 后 / 左的八拍步态。最后一行：待机、坐姿、仰望、跳跃、挥手、拍照、堆沙。选择左右方向可检查交替迈步与停步站姿。</p>
<img class="design" src="character-design.png" alt="小满原创四视图"><img class="design" src="companion-design.png" alt="阿屿原创男性四视图">
<script src="../src/character.js"></script><script>
let pose='idle',direction='right';const names={idle:'待机',walk:'行走',sit:'坐下',look:'仰望',jump:'跳跃',wave:'挥手',photo:'拍照',build:'堆沙'};
for(const [id,label]of Object.entries(names)){const button=document.createElement('button');button.textContent=label;button.dataset.pose=id;button.classList.toggle('active',id===pose);button.onclick=()=>{pose=id;document.querySelectorAll('#poses button').forEach(b=>b.classList.toggle('active',b===button));};document.getElementById('poses').append(button);}
for(const [id,label]of Object.entries({left:'← 向左',right:'向右 →',up:'↑ 向后',down:'向前 ↓'})){const button=document.createElement('button');button.textContent=label;button.classList.toggle('active',id===direction);button.onclick=()=>{direction=id;document.querySelectorAll('#directions button').forEach(b=>b.classList.toggle('active',b===button));};document.getElementById('directions').append(button);}
IslandCharacter.ready.then(()=>{for(const variant of ['girl','boy']){const a=IslandCharacter.atlas(variant),p=document.getElementById(variant);p.width=a.width;p.height=a.height;p.getContext('2d').drawImage(a,0,0);}});
function tick(ms){for(const variant of ['girl','boy'])IslandCharacter.drawPreview(document.getElementById('live-'+variant),{variant,pose,direction,time:ms/1000});requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>

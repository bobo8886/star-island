<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>完整步态 v6 · 实际渲染连播</title>
<style>body{margin:0;background:#142334;color:#eddcc1;font:15px system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:23px}p{color:#bacbd4}nav{display:flex;gap:12px;align-items:center;margin:15px 0}button,select{padding:8px 18px;background:#304a59;color:#f3e2bf;border:1px solid #65716c;border-radius:8px}canvas{width:100%;image-rendering:pixelated;background:#203248}a{color:#f3d692}</style>
<main><h1>完整步态 v6 · 实际渲染连播</h1><p>整个人物按新图集逐帧播放。青线为同一落脚基准。上排正常速度，下排慢速；可暂停逐帧比较接触、承重、交错、抬膝与反向摆臂。</p><nav><select id="direction"><option value="right">向右</option><option value="left">向左</option><option value="down">正面</option><option value="up">背面</option></select><button id="pause">暂停</button><button id="step">下一帧</button><button id="idle">查看站姿</button><a href="gait-frame-review.html">全部方向联图</a></nav><canvas id="loop" width="1100" height="860"></canvas><p id="status">正在载入完整动作图……</p></main>
<script src="../src/character.js"></script><script>
let playing=true,standing=false,manual=0,clock=0,last=performance.now();const canvas=document.getElementById('loop'),g=canvas.getContext('2d');g.imageSmoothingEnabled=false;
document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'暂停':'继续';};document.getElementById('step').onclick=()=>{playing=false;standing=false;manual=(manual+1)%8;document.getElementById('pause').textContent='继续';};document.getElementById('idle').onclick=()=>{standing=!standing;document.getElementById('idle').textContent=standing?'恢复行走':'查看站姿';};
IslandCharacter.ready.then(()=>{document.getElementById('status').textContent=IslandCharacter.motionRendering+' · 48 张原创完整步态 + 6 张站姿 · 左向整帧镜像';window.walkV6PreviewReady=true;requestAnimationFrame(paint);});
function paint(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(playing)clock+=dt;g.fillStyle='#203248';g.fillRect(0,0,1100,860);const direction=document.getElementById('direction').value;for(let row=0;row<2;row++){const beat=standing?0:playing?Math.floor(clock*(row===0?12.5:4))%8:manual;g.fillStyle='#eed9b4';g.font='20px system-ui';g.fillText((row===0?'正常速度':'慢速检查')+' · '+direction+' · '+(standing?'站定':'第 '+(beat+1)+' / 8 帧'),30,row*420+32);for(let col=0;col<2;col++){const x=275+col*550,y=row*420+402;g.fillStyle='#71bcae';g.fillRect(x-160,y,320,1);IslandCharacter.draw(g,{x,y,direction,walk:standing?0:(beat+.1)/1.25},{variant:col===0?'girl':'boy',phase:'day',pose:standing?'idle':'walk',scale:1.95,shadow:true});}}requestAnimationFrame(paint);}
</script></html>

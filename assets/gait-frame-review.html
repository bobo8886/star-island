<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>双人全方向步态 · 落脚检查</title><style>body{margin:0;padding:20px;background:#203248;color:#f2dfba;font:15px system-ui}canvas{display:block;width:100%;max-width:2880px;image-rendering:pixelated;margin-bottom:30px}p{line-height:1.7}</style><h1>双人全方向步态 · 落脚检查</h1><p>每行左到右：8 个步态相位、原地站定。青色线为同一脚底边界184；行进时至少一只支撑靴保持接地。可放大原图检查髋、膝与踝的完整轮廓。</p><canvas id="girl"></canvas><canvas id="boy"></canvas><script src="../src/character.js"></script><script>
IslandCharacter.ready.then(()=>{for(const variant of ['girl','boy']){const c=document.getElementById(variant);c.width=2880;c.height=1672;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#203248';g.fillRect(0,0,c.width,c.height);['down','right','up','left'].forEach((dir,row)=>{for(let beat=0;beat<9;beat++){const x=beat*320,y=row*418;g.fillStyle='#f2dfba';g.font='19px system-ui';g.fillText(variant+' · '+dir+' · '+(beat===8?'原地站定':'步态 '+beat),x+48,y+25);g.drawImage(IslandCharacter.frame(dir,beat===8?'idle':'walk',beat,false,variant),x,y+30,320,384);g.fillStyle='#80cdbf';g.fillRect(x+45,y+30+184*2,230,1);}});}window.gaitReviewReady=true;});
</script></html>

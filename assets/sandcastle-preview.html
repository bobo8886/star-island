<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海边的小城堡 · 四阶段检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#16283c;color:#f3dfbc;font:14px system-ui;padding:28px}h1{font-size:24px;font-weight:500}p{color:#bdccd1}canvas{max-width:100%;image-rendering:pixelated;background:linear-gradient(#efd19a,#dfb77b);border:1px solid #d1b16c}button{padding:10px 14px;margin:12px 6px 12px 0;background:#294458;color:#f8e6c3;border:1px solid #bdc8bd77}</style>
<h1>一捧沙，变成两个人的小小王国。</h1><p>四个建设阶段 · 同脚底锚点 · 原创高细节透明模型 · 轻轻飘动的旗与护城河水光</p><button id="pause">暂停动态</button><canvas id="review" width="1200" height="400"></canvas><script>window.ISLAND_ASSETS={"assets/sandcastle-stages.png":"sandcastle-stages.png"};</script><script src="../src/sandcastle.js"></script><script>
const c=document.getElementById('review'),g=c.getContext('2d');let still=false;document.getElementById('pause').onclick=()=>still=!still;
IslandSandcastle.ready.then(()=>{function tick(ms){g.clearRect(0,0,c.width,c.height);for(let i=0;i<4;i++){IslandSandcastle.draw(g,{x:150+i*300,y:330,stage:i,time:ms/1000,scale:.48,active:true,building:i===2,reducedMotion:still});g.fillStyle='#6a563a';g.font='16px "Microsoft YaHei",sans-serif';g.textAlign='center';g.fillText(['准备好小桶','塑出地基','筑起双塔','星旗小王国'][i],150+i*300,380);}requestAnimationFrame(tick);}requestAnimationFrame(tick);});</script></html>

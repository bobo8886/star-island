name: 功能建议
description: 提出玩法、界面、教程或无障碍体验方面的改进。
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎描述你想改善的体验。请先搜索是否已有相似建议；不必附带代码或设计图。
        项目允许非商业使用、修改和免费分享，建议也应与 [项目许可](https://github.com/Bobo688li/star-island/blob/main/LICENSE) 的范围一致。
  - type: textarea
    id: situation
    attributes:
      label: 使用场景或遇到的问题
      description: 你在什么场景下需要这项改进？现有体验哪里不方便？
      placeholder: "例如：制作生日礼物时，我希望……"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望增加或调整的功能
      description: 尽量描述玩家实际能看到或完成的事情。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法（可选）
      description: 是否有现有功能或临时做法能部分解决？
  - type: textarea
    id: reference
    attributes:
      label: 参考或补充（可选）
      description: 可以提供公开参考链接、草图或文字。请不要上传私人照片、语音、备份或无权分享的素材。

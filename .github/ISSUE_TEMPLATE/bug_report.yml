name: 错误反馈
description: 报告游戏、界面、存档或导出功能的问题。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进星屿寻迹。请用通用示例描述问题，不要上传私人照片、语音、完整存档或访问凭据。
        涉及数据泄露、未授权脚本执行等安全问题，请改用 [私密漏洞报告](https://github.com/bobo8886/star-island-time-capsule/security/advisories/new)。
  - type: input
    id: version
    attributes:
      label: 游戏版本或提交号
      description: 可填写下载版本、提交号，或在线页面的访问日期；不知道时请注明。
      placeholder: "例如：6.2.1 / 在线试玩，2026-11-16 访问"
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: 怎样打开游戏
      options:
        - GitHub Pages 在线试玩
        - 下载的星屿寻迹.html
        - 工坊导出的专属礼物 HTML
        - npm start 本地服务器
        - 自己部署的网站或其他方式（请在步骤中说明）
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备、系统和浏览器
      placeholder: "例如：Windows 11 + Edge / iPhone + Safari；如有布局问题，可补充屏幕方向"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从进入游戏开始，描述能够再次看到问题的操作。
      placeholder: |
        1. 打开游戏并进入……
        2. 点击或按下……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的表现
      placeholder: 本来希望游戏怎样表现？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际的表现
      placeholder: 实际发生了什么？是否每次都会发生？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息（可选）
      description: 可粘贴去除私人信息后的错误文本或截图，也可仅用文字说明。无需提供私人照片或完整备份。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查内容，不包含私人备份、照片、语音或访问凭据。
          required: true
